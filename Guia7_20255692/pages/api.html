
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía 7 - API de películas</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

  <header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">
        <span class="badge">JS</span> Guía 7 DOM
      </a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/ejemplo1.html">Ejemplo 1</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/ejemplo2.html">Ejemplo 2</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/ejemplo3.html">Ejemplo 3</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/ejemplo4.html">Ejemplo 4</a></li>
          <li class="nav-item"><a class="nav-link active" href="../pages/api.html">API</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main class="container py-5">

    <h1 class="display-5 fw-bold text-center mb-3">
      Explorador de películas
    </h1>

    <p class="text-center text-muted mb-4">
      Consulta películas y descubre información sobre ellas utilizando
      RapidAPI y Fetch API.
    </p>

    <!-- Buscador -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-8">
        <div class="input-group">
          <input
            type="text"
            id="idBusqueda"
            class="form-control"
            placeholder="Buscar una película..."
          >

          <button id="idBuscar" class="btn btn-primary">
            <i class="bi bi-search"></i> Buscar
          </button>

          <button id="idVolver" class="btn btn-outline-secondary">
            Ver catálogo
          </button>
        </div>
      </div>
    </div>

    <!-- Cargando -->
    <div id="idCargando" class="text-center my-4" hidden>
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 mb-0">Cargando información...</p>
    </div>

    <!-- Mensajes de error -->
    <div id="idError" class="alert alert-danger d-none" role="alert"></div>

    <!-- Listado -->
    <section>
      <h2 class="h4 mb-3">Catálogo de películas</h2>
      <div id="idListado" class="row g-4"></div>
    </section>

    <!-- Detalle -->
    <section id="idDetalle" class="mt-5" hidden>
      <h2 class="h4 mb-3">Detalle de la película</h2>
      <div id="idDetalleContenido" class="bg-white border rounded p-4"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>

</body>
</html>
