<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../js/pedidos.js" defer></script>
    <title>Pedidos de cafetería</title>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="text-center mb-4">Pedidos de cafetería</h1>

        <!-- Formulario de registro -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Registrar pedido</h5>
                <form id="formPedido" novalidate>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="producto" class="form-label">Producto</label>
                            <input type="text" class="form-control" id="producto" placeholder="Café americano" required />
                        </div>
                        <div class="col-md-4">
                            <label for="precio" class="form-label">Precio unitario ($)</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="precio" placeholder="2.50" required />
                        </div>
                        <div class="col-md-4">
                            <label for="cantidad" class="form-label">Cantidad</label>
                            <input type="number" step="1" min="1" class="form-control" id="cantidad" placeholder="3" required />
                        </div>
                    </div>
                    <div id="mensajeError" class="text-danger mt-2"></div>
                    <button type="submit" class="btn btn-primary mt-3">Agregar pedido</button>
                </form>
            </div>
        </div>

        <!-- Filtro por precio máximo -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Filtrar por precio máximo</h5>
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="precioMaximo" class="form-label">Precio máximo ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="precioMaximo" placeholder="0.00" />
                    </div>
                    <div class="col-md-8 d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-success" id="btnFiltrar">Filtrar productos</button>
                        <button type="button" class="btn btn-secondary" id="btnMostrarTodos">Mostrar todos</button>
                        <button type="button" class="btn btn-danger" id="btnLimpiar">Limpiar pedidos</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de pedidos -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Listado de pedidos</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="tablaPedidos">
                        <thead class="table-success">
                            <tr>
                                <th>Producto</th>
                                <th>Precio unitario</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla"></tbody>
                    </table>
                </div>

                <div class="d-flex flex-wrap gap-4 mt-3">
                    <p class="mb-0"><strong>Total de unidades solicitadas:</strong> <span id="totalUnidades">0</span></p>
                    <p class="mb-0"><strong>Monto total de los pedidos:</strong> $<span id="totalMonto">0.00</span></p>
                </div>
            </div>
        </div>

        <a href="../index.html" class="btn btn-outline-primary w-100">Regresar</a>
    </div>
</body>
</html>
